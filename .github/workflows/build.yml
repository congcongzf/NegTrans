name: Build NegTrans

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .app and DMG
        run: bash scripts/build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NegTrans-dmg
          path: build/NegTrans-*.dmg
